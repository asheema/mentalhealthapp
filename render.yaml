# render.yaml
# This config file tells Render how to deploy your Streamlit app
services:
  - type: web
    name: mental-health-app
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port=8501 --server.address=0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
    plan: free
